# Firebase App Hosting — https://firebase.google.com/docs/app-hosting
# Set secrets/variables in Firebase console (Hosting → App Hosting → Backend → Environment)
# or with: firebase apphosting:secrets:set SECRET_NAME

scripts:
  buildCommand: npm run build
  runCommand: npm start

# Serve dist/ via firebase.json hosting.public (do not use "superstatic dist" — that
# double-nests the public path and returns "Cannot GET /").
outputFiles:
  serverApp:
    include:
      - dist
      - firebase.json
      - package.json
      - package-lock.json

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Firebase web config is in committed .env.production (public client values).
# Passwords are secrets — set with: firebase apphosting:secrets:set viteSitePassword
env:
  - variable: VITE_SITE_PASSWORD
    secret: viteSitePassword
    availability:
      - BUILD
  - variable: VITE_EDITOR_PASSWORD
    secret: viteEditorPassword
    availability:
      - BUILD
