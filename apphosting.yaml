# Firebase App Hosting — https://firebase.google.com/docs/app-hosting
# Set secrets/variables in Firebase console (Hosting → App Hosting → Backend → Environment)
# or with: firebase apphosting:secrets:set SECRET_NAME

scripts:
  buildCommand: npm run build
  runCommand: npm start

# Serve dist/ via firebase.json hosting.public (do not use "superstatic dist" — that
# double-nests the public path and returns "Cannot GET /").
outputFiles:
  serverApp:
    include:
      - dist
      - firebase.json
      - package.json
      - package-lock.json

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Vite reads VITE_* at build time. Mark BUILD availability in the console when adding vars.
# Example (prefer Firebase console or secrets for production):
# env:
#   - variable: VITE_FIREBASE_API_KEY
#     secret: viteFirebaseApiKey
#     availability:
#       - BUILD
#   - variable: VITE_FIREBASE_AUTH_DOMAIN
#     secret: viteFirebaseAuthDomain
#     availability:
#       - BUILD
#   - variable: VITE_FIREBASE_PROJECT_ID
#     secret: viteFirebaseProjectId
#     availability:
#       - BUILD
#   - variable: VITE_FIREBASE_STORAGE_BUCKET
#     secret: viteFirebaseStorageBucket
#     availability:
#       - BUILD
#   - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
#     secret: viteFirebaseMessagingSenderId
#     availability:
#       - BUILD
#   - variable: VITE_FIREBASE_APP_ID
#     secret: viteFirebaseAppId
#     availability:
#       - BUILD
#   - variable: VITE_EDITOR_PASSWORD
#     secret: viteEditorPassword
#     availability:
#       - BUILD
